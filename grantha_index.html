<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vedic Space Grantha – Research Workspace v1.2</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
:root{
    --indigo:#1a1f3c;
    --saffron:#d97706;
    --bg:#f5f3ee;
    --border:#ddd;
}
body{
    margin:0;
    font-family:Georgia,serif;
    background:var(--bg);
}
header{
    background:var(--indigo);
    color:white;
    padding:15px;
    text-align:center;
}
header span{color:var(--saffron);}
.workspace{
    display:flex;
    height:calc(100vh - 80px);
}
.panel{
    flex:1;
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--border);
}
.panel:last-child{border-right:none;}
.toolbar{
    background:white;
    padding:6px;
    border-bottom:1px solid var(--border);
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    align-items:center;
}
button, select{
    padding:6px 8px;
    border:none;
    cursor:pointer;
    background:var(--indigo);
    color:white;
    font-size:12px;
}
button.secondary{background:var(--saffron);}
textarea{
    flex:1;
    border:none;
    resize:none;
    padding:12px;
    font-size:15px;
    line-height:1.6;
    outline:none;
}
textarea.source{background:#fffdf6;}
textarea.target{background:white;}
#imageContainer{
    flex:1;
    overflow:auto;
    background:#000;
    text-align:center;
}
#manuscriptImage{
    max-width:100%;
    transform-origin:center center;
}
.status{
    font-size:12px;
}
</style>
</head>

<body>

<header>
<h2>Vedic Space <span>Grantha</span> – Research Workspace v1.2</h2>
</header>

<div class="workspace">

<!-- PANEL 1 – MANUSCRIPT -->
<div class="panel">
<div class="toolbar">
<input type="file" accept="image/*" onchange="loadImage(event)">
<button onclick="zoomIn()">Zoom +</button>
<button onclick="zoomOut()">Zoom -</button>
<button class="secondary" onclick="runOCR()">Extract OCR</button>
<span class="status" id="ocrStatus">OCR idle</span>
</div>
<div id="imageContainer">
<img id="manuscriptImage">
</div>
</div>

<!-- PANEL 2 – SOURCE -->
<div class="panel">
<div class="toolbar">
<button onclick="speakText('sourceText','kn')">Read</button>
<button onclick="pauseSpeech()">Pause</button>
<button onclick="resumeSpeech()">Resume</button>
<button onclick="stopSpeech()">Stop</button>
<button onclick="copyText('sourceText')">Copy</button>
<button onclick="downloadText('sourceText','kannada.txt')">Download</button>
</div>
<textarea id="sourceText" class="source" placeholder="OCR text will auto-load here..."></textarea>
</div>

<!-- PANEL 3 – OUTPUT -->
<div class="panel">
<div class="toolbar">
<select id="mode">
<option value="iast">IAST</option>
<option value="en">English</option>
<option value="sa">Sanskrit</option>
</select>
<button class="secondary" onclick="processText()">Process</button>

<button onclick="readOutput()">Read</button>
<button onclick="pauseSpeech()">Pause</button>
<button onclick="resumeSpeech()">Resume</button>
<button onclick="stopSpeech()">Stop</button>

<button onclick="copyText('targetText')">Copy</button>
<button onclick="downloadText('targetText','output.txt')">Download</button>
</div>
<textarea id="targetText" class="target" placeholder="IAST / Translation output..."></textarea>
</div>

</div>

<script>

/* ================= IMAGE VIEWER ================= */
let scale=1;
let currentImage=null;

function loadImage(event){
    const reader=new FileReader();
    reader.onload=function(){
        currentImage=reader.result;
        document.getElementById('manuscriptImage').src=currentImage;
    }
    reader.readAsDataURL(event.target.files[0]);
}
function zoomIn(){ scale+=0.1; updateZoom(); }
function zoomOut(){ scale-=0.1; updateZoom(); }
function updateZoom(){
    document.getElementById('manuscriptImage').style.transform=`scale(${scale})`;
}

/* ================= OCR ================= */
async function runOCR(){
    if(!currentImage){
        alert("Upload image first.");
        return;
    }
    const status=document.getElementById("ocrStatus");
    status.innerText="Initializing OCR...";

    const worker=await Tesseract.createWorker({
        logger: m=>{
            if(m.status==="recognizing text"){
                status.innerText="Recognizing "+Math.round(m.progress*100)+"%";
            }
        }
    });

    await worker.loadLanguage('kan');
    await worker.initialize('kan');
    const { data } = await worker.recognize(currentImage);

    document.getElementById("sourceText").value=data.text;
    status.innerText="Confidence: "+data.confidence.toFixed(2)+"%";
    await worker.terminate();
}

/* ================= SPEECH ENGINE ================= */
let voices=[];
let currentUtterance=null;

function loadVoices(){
    voices=speechSynthesis.getVoices();
}
speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

function getBestVoice(lang){
    let v=voices.find(v=>v.lang===lang);
    if(v) return v;
    v=voices.find(v=>v.lang.startsWith(lang.split('-')[0]));
    if(v) return v;
    return voices[0];
}

function getSelectedOrFull(id){
    const t=document.getElementById(id);
    const sel=t.value.substring(t.selectionStart,t.selectionEnd);
    return sel.length>0?sel:t.value;
}

function speakText(id,mode){
    const text=getSelectedOrFull(id);
    if(!text.trim()) return;

    speechSynthesis.cancel();
    currentUtterance=new SpeechSynthesisUtterance(text);

    let lang;
    if(mode==="kn") lang="kn-IN";
    else if(mode==="sa" || mode==="iast") lang="sa-IN";
    else lang="en-IN";

    currentUtterance.lang=lang;
    currentUtterance.voice=getBestVoice(lang);
    currentUtterance.rate=0.95;

    speechSynthesis.speak(currentUtterance);
}

function readOutput(){
    const mode=document.getElementById("mode").value;
    speakText("targetText",mode);
}
function pauseSpeech(){ if(speechSynthesis.speaking) speechSynthesis.pause(); }
function resumeSpeech(){ if(speechSynthesis.paused) speechSynthesis.resume(); }
function stopSpeech(){ speechSynthesis.cancel(); }

/* ================= UTILITIES ================= */
function copyText(id){
    const t=document.getElementById(id);
    t.select();
    document.execCommand("copy");
}
function downloadText(id,file){
    const blob=new Blob([document.getElementById(id).value],{type:'text/plain'});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=file;
    a.click();
}

/* ================= TRANSLITERATION ================= */
const vowels={"ಅ":"a","ಆ":"ā","ಇ":"i","ಈ":"ī","ಉ":"u","ಊ":"ū","ಋ":"ṛ","ಎ":"e","ಏ":"ē","ಐ":"ai","ಒ":"o","ಓ":"ō","ಔ":"au"};
const vowelSigns={"ಾ":"ā","ಿ":"i","ೀ":"ī","ು":"u","ೂ":"ū","ೃ":"ṛ","ೆ":"e","ೇ":"ē","ೈ":"ai","ೊ":"o","ೋ":"ō","ೌ":"au"};
const consonants={"ಕ":"k","ಖ":"kh","ಗ":"g","ಘ":"gh","ಙ":"ṅ","ಚ":"c","ಛ":"ch","ಜ":"j","ಝ":"jh","ಞ":"ñ","ಟ":"ṭ","ಠ":"ṭh","ಡ":"ḍ","ಢ":"ḍh","ಣ":"ṇ","ತ":"t","ಥ":"th","ದ":"d","ಧ":"dh","ನ":"n","ಪ":"p","ಫ":"ph","ಬ":"b","ಭ":"bh","ಮ":"m","ಯ":"y","ರ":"r","ಲ":"l","ವ":"v","ಶ":"ś","ಷ":"ṣ","ಸ":"s","ಹ":"h","ಳ":"ḷ"};

function transliterateKannada(text){
    let result="";
    for(let i=0;i<text.length;i++){
        let c=text[i];
        if(vowels[c]) result+=vowels[c];
        else if(consonants[c]){
            let next=text[i+1];
            let base=consonants[c];
            if(vowelSigns[next]){
                result+=base+vowelSigns[next]; i++;
            } else if(next==="್"){
                result+=base; i++;
            } else result+=base+"a";
        }
        else if(c==="ಂ") result+="ṃ";
        else if(c==="ಃ") result+="ḥ";
        else result+=c;
    }
    return result;
}

/* ================= PROCESS ================= */
async function processText(){
    const mode=document.getElementById("mode").value;
    const text=document.getElementById("sourceText").value;

    if(mode==="iast"){
        document.getElementById("targetText").value=transliterateKannada(text);
    } else {
        let url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=kn&tl=${mode}&dt=t&q=${encodeURIComponent(text)}`;
        const res=await fetch(url);
        const data=await res.json();
        document.getElementById("targetText").value=data[0].map(x=>x[0]).join("");
    }
}

</script>

</body>
</html>
