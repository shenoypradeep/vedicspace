<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vedic Space | Amarakosha</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#1e3a8a;
  --gold:#fbbf24;
  --bg:#0f172a;
  --card:rgba(255,255,255,0.06);
  --border:rgba(251,191,36,0.25);
  --text:#f8fafc;
  --muted:#cbd5e1;
  --radius:18px;
  --sidebar:300px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Inter,sans-serif;
  background:linear-gradient(135deg,#1e3a8a,#0f172a);
  color:var(--text);
  min-height:100vh;
}

.app{display:flex;flex-direction:column}

/* Sidebar */
.sidebar{
  width:var(--sidebar);
  position:fixed;
  inset:0 auto 0 0;
  background:rgba(30,58,138,0.96);
  border-right:1px solid var(--border);
  padding:1.5rem;
  display:flex;
  flex-direction:column;
  gap:1.25rem;
}

.logo{
  font-family:Playfair Display,serif;
  font-size:1.4rem;
  font-weight:600;
}

.sidebar h1{
  font-family:Playfair Display,serif;
  font-weight:400;
  line-height:1.2;
}

.sidebar h1 span{color:var(--gold)}

.search input{
  width:100%;
  padding:0.85rem 1.1rem;
  border-radius:30px;
  border:2px solid var(--border);
  background:rgba(255,255,255,0.1);
  color:white;
  font-size:1rem;
}

.search input::placeholder{
  color:var(--muted);
}

.search input:focus{
  outline:none;
  border-color:var(--gold);
}

.toggle{
  display:flex;
  gap:0.5rem;
}

.toggle button{
  flex:1;
  padding:0.45rem 0;
  border-radius:20px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:0.8rem;
}

.toggle button.active{
  background:var(--gold);
  color:#1e3a8a;
  font-weight:600;
}

.count{
  font-size:0.85rem;
  color:var(--muted);
}

/* Added mobile header styles */
.mobile-header{
  display:none;
  background:rgba(30,58,138,0.98);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--border);
}

.mobile-header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0.75rem 1rem;
}

.mobile-logo{
  font-family:Playfair Display,serif;
  font-size:1.1rem;
  font-weight:600;
  color:var(--gold);
}

.mobile-count{
  font-size:0.75rem;
  color:var(--muted);
  background:rgba(255,255,255,0.1);
  padding:0.25rem 0.6rem;
  border-radius:12px;
}

.mobile-search{
  padding:0 1rem 0.75rem;
}

.mobile-search input{
  width:100%;
  padding:0.65rem 1rem;
  border-radius:25px;
  border:1.5px solid var(--border);
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:0.9rem;
}

.mobile-search input::placeholder{
  color:var(--muted);
}

.mobile-search input:focus{
  outline:none;
  border-color:var(--gold);
  background:rgba(255,255,255,0.12);
}

.mobile-toggle{
  display:flex;
  gap:0.4rem;
  padding:0 1rem 0.75rem;
}

.mobile-toggle button{
  flex:1;
  padding:0.4rem 0;
  border-radius:16px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:0.75rem;
}

.mobile-toggle button.active{
  background:var(--gold);
  color:#1e3a8a;
  font-weight:600;
}

/* Main */
main{
  margin-left:var(--sidebar);
  padding:3rem;
  width:100%;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:1.5rem;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.8rem;
}

.badge{
  display:inline-block;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#1e3a8a;
  font-size:0.65rem;
  font-weight:700;
  padding:0.3rem 0.8rem;
  border-radius:20px;
  margin-bottom:0.8rem;
  text-transform:uppercase;
  letter-spacing:0.08em;
}

.word{
  font-family:Playfair Display,serif;
  font-size:1.7rem;
  margin-bottom:0.35rem;
}

.translit{
  font-style:italic;
  color:var(--muted);
  margin-bottom:0.5rem;
}

.meta{
  font-size:0.75rem;
  color:var(--muted);
  margin-bottom:0.5rem;
}

.meaning{
  line-height:1.6;
}

.empty, .loading{
  grid-column:1/-1;
  text-align:center;
  padding:5rem 2rem;
  color:var(--muted);
}

/* Updated mobile responsive styles */
@media(max-width:900px){
  .sidebar{display:none}
  .mobile-header{display:block}
  .app{flex-direction:column}
  main{
    margin:0;
    padding:1rem;
    min-height:calc(100vh - 140px);
  }
  .cards{
    grid-template-columns:1fr;
    gap:1rem;
  }
  .card{
    padding:1.25rem;
  }
  .word{
    font-size:1.4rem;
  }
  .meaning{
    font-size:0.9rem;
  }
}

@media(max-width:400px){
  .mobile-header-top{
    padding:0.6rem 0.75rem;
  }
  .mobile-logo{
    font-size:1rem;
  }
  .mobile-search{
    padding:0 0.75rem 0.6rem;
  }
  .mobile-search input{
    padding:0.55rem 0.85rem;
    font-size:0.85rem;
  }
  .mobile-toggle{
    padding:0 0.75rem 0.6rem;
  }
  main{
    padding:0.75rem;
  }
  .card{
    padding:1rem;
    border-radius:14px;
  }
  .word{
    font-size:1.2rem;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- Added mobile header with search and script toggle -->
  <header class="mobile-header">
    <div class="mobile-header-top">
      <div class="mobile-logo">Vedic Space</div>
      <div class="mobile-count">Results: <span id="count-mobile">0</span></div>
    </div>
    <div class="mobile-search">
      <input id="search-mobile" placeholder="Enter Sanskrit word…" autocomplete="off">
    </div>
    <div class="mobile-toggle">
      <button data-script="dv" class="active">DV</button>
      <button data-script="ia">IAST</button>
      <button data-script="hk">HK</button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="logo">Vedic Space</div>

    <h1><span>Sanskrit</span><br>Dictionary</h1>

    <div class="search">
      <input id="search" placeholder="Enter Sanskrit word…" autocomplete="off">
    </div>

    <div class="toggle">
      <button data-script="dv" class="active">DV</button>
      <button data-script="ia">IAST</button>
      <button data-script="hk">HK</button>
    </div>

    <div class="count">
      Results: <strong id="count">0</strong>
    </div>
  </aside>

  <main>
    <div class="cards" id="cards">
      <div class="empty">Enter a Sanskrit word to begin</div>
    </div>
  </main>

</div>

<script>
const API = "https://vedicspace-skt-dict.shenoypradeep.workers.dev";

const cards = document.getElementById("cards");
const searchDesktop = document.getElementById("search");
const searchMobile = document.getElementById("search-mobile");
const countDesktop = document.getElementById("count");
const countMobile = document.getElementById("count-mobile");
const togglesDesktop = document.querySelectorAll(".sidebar .toggle button");
const togglesMobile = document.querySelectorAll(".mobile-toggle button");

let currentScript = "dv";
let debounce = null;

function updateCount(num){
  countDesktop.textContent = num;
  countMobile.textContent = num;
}

function setActiveScript(script){
  currentScript = script;
  togglesDesktop.forEach(b => {
    b.classList.toggle("active", b.dataset.script === script);
  });
  togglesMobile.forEach(b => {
    b.classList.toggle("active", b.dataset.script === script);
  });
}

togglesDesktop.forEach(btn=>{
  btn.onclick = ()=>{
    setActiveScript(btn.dataset.script);
    const q = searchDesktop.value.trim() || searchMobile.value.trim();
    if(q) lookup(q);
  };
});

togglesMobile.forEach(btn=>{
  btn.onclick = ()=>{
    setActiveScript(btn.dataset.script);
    const q = searchMobile.value.trim() || searchDesktop.value.trim();
    if(q) lookup(q);
  };
});

async function lookup(word){
  cards.innerHTML = `<div class="loading">Searching…</div>`;
  updateCount("…");

  try{
    const url = `${API}?search=${encodeURIComponent(word)}&dir=au`;
    const res = await fetch(url);
    const data = await res.json();
    render(data.results || []);
  }catch{
    cards.innerHTML = `<div class="empty">Unable to fetch results</div>`;
    updateCount(0);
  }
}

function render(results){
  cards.innerHTML = "";
  updateCount(results.length);

  if(!results.length){
    cards.innerHTML = `<div class="empty">No results found</div>`;
    return;
  }

  results.forEach(r=>{
    const word =
      currentScript === "dv" ? r.dv :
      currentScript === "ia" ? r.ia :
      r.sk;

    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <span class="badge">${r.grammar || "entry"}</span>
      <div class="word">${word || ""}</div>
      <div class="translit">${r.ia || ""}</div>
      <div class="meta">${r.source || ""}</div>
      <div class="meaning">${r.en || ""}</div>
    `;
    cards.appendChild(el);
  });
}

searchDesktop.addEventListener("input", e=>{
  clearTimeout(debounce);
  const q = e.target.value.trim();
  searchMobile.value = e.target.value;
  if(!q){
    cards.innerHTML = `<div class="empty">Enter a Sanskrit word to begin</div>`;
    updateCount(0);
    return;
  }
  debounce = setTimeout(()=>lookup(q), 500);
});

searchMobile.addEventListener("input", e=>{
  clearTimeout(debounce);
  const q = e.target.value.trim();
  searchDesktop.value = e.target.value;
  if(!q){
    cards.innerHTML = `<div class="empty">Enter a Sanskrit word to begin</div>`;
    updateCount(0);
    return;
  }
  debounce = setTimeout(()=>lookup(q), 500);
});
</script>

</body>
</html>
