          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          }

          :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
            --blue-accent: #1f8fe8;
            --shadow-light: 0 1px 2px rgba(32, 33, 36, 0.08);
            --shadow-md: 0 2px 8px rgba(32, 33, 36, 0.15);
          }

          body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            min-height: 100vh;
          }

          .serif {
            font-family: 'Playfair Display', serif;
          }

          .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
          }

          .header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            box-shadow: var(--shadow-light);
            position: sticky;
            top: 0;
            z-index: 100;
          }

          .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
          }

          .logo span {
            color: var(--blue-accent);
          }

          .logo-subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 400;
            display: block;
            text-align: center;
            margin-top: 4px;
          }

          .main-layout {
            display: flex;
            gap: 0;
            min-height: calc(100vh - 100px);
            background-color: var(--bg-secondary);
            margin-top: 16px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
          }

          .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid var(--border-color);
            position: relative;
          }

          .panel:last-child {
            border-right: none;
          }

          .panel-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.8px;
          }

          .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            background-color: var(--bg-primary);
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
          }

          .upload-area:hover {
            border-color: var(--blue-accent);
            background-color: rgba(31, 143, 232, 0.05);
          }

          .upload-icon {
            font-size: 32px;
            margin-bottom: 8px;
          }

          .upload-text {
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 4px;
            font-size: 14px;
          }

          .upload-hint {
            font-size: 12px;
            color: var(--text-secondary);
          }

          .file-input {
            display: none;
          }

          .image-preview {
            width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-bottom: 16px;
            object-fit: contain;
            border: 1px solid var(--border-color);
          }

          .text-display {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            flex: 1;
            overflow-y: auto;
            word-wrap: break-word;
            font-family: 'Noto Sans Kannada', sans-serif;
            color: var(--text-primary);
            user-select: text;
            line-height: 1.7;
            font-size: 16px;
          }

          .text-display.english {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          }

          .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
          }

          .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            height: 36px;
            min-width: fit-content;
            color: var(--text-secondary);
            background-color: transparent;
          }

          .btn-primary {
            background-color: var(--blue-accent);
            color: white;
          }

          .btn-secondary {
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
          }

          .btn:hover:not(:disabled) {
            background-color: rgba(31, 143, 232, 0.1);
            color: var(--blue-accent);
          }

          .btn-primary:hover:not(:disabled) {
            background-color: #1a73e8;
            color: white;
          }

          .btn-secondary:hover:not(:disabled) {
            background-color: var(--bg-primary);
            border-color: var(--text-secondary);
            color: var(--text-primary);
          }

          .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
          }

          .loading {
            text-align: center;
            color: var(--text-secondary);
            margin: 16px 0;
            font-size: 13px;
          }

          .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top-color: var(--blue-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
          }

          @keyframes spin {
            to { transform: rotate(360deg); }
          }

          .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 32px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
          }

          .empty-icon {
            font-size: 36px;
            margin-bottom: 12px;
          }

          .feedback {
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 12px;
            display: none;
            border-left: 4px solid transparent;
          }

          .feedback.success {
            display: block;
            background-color: #f1f3f4;
            border-left-color: #34a853;
            color: #1b7939;
          }

          .feedback.error {
            display: block;
            background-color: #f8d7da;
            border-left-color: #d32f2f;
            color: #b3261e;
          }

          @media (max-width: 1024px) {
            .main-layout {
              flex-direction: column;
            }

            .panel {
              border-right: none;
              border-bottom: 1px solid var(--border-color);
            }

            .panel:last-child {
              border-bottom: none;
            }
          }

          @media (max-width: 768px) {
            .panel {
              padding: 16px;
            }

            .header {
              padding: 12px 16px;
            }

            .logo {
              font-size: 20px;
            }
          }
        </style></head><body><header class="header"><div class="container"><div class="logo">Kannada <span>Translator</span></div></div></header><div class="container" style="padding-top:16px;padding-bottom:16px"><div class="main-layout"><div class="panel"><h2 class="panel-title">Kannada (Source)</h2><div id="kannadaUploadArea" class="upload-area"><div class="upload-icon">📄</div><div class="upload-text">Upload image of Kannada text</div><div class="upload-hint">PNG, JPG, GIF, or BMP</div><input id="kannadaImageInput" type="file" accept="image/*" class="file-input"/></div><img id="kannadaImagePreview" class="image-preview" style="display:none"/><div id="kannadaFeedback" class="feedback"></div><div id="kannadaExtractContainer" style="display:none;margin-bottom:12px"><button id="extractBtn" class="btn btn-primary" style="width:100%">Extract Text</button></div><div id="kannadaTextContainer" style="display:none"><div id="kannadaText" class="text-display"></div><div class="button-group"><button id="kannadaSpeakBtn" class="btn btn-secondary">Speak</button><button id="kannadaCopyBtn" class="btn btn-secondary">Copy</button><button id="kannadaDownloadBtn" class="btn btn-secondary">Download</button></div></div><div id="kannadaEmptyState" class="empty-state"><p style="font-size:14px;margin-bottom:8px">Kannada text will appear here after extraction</p></div></div><div class="panel"><h2 class="panel-title">English (Translation)</h2><div id="englishFeedback" class="feedback"></div><div id="englishTextContainer" style="display:none"><div id="englishText" class="text-display english"></div><div class="button-group"><button id="englishSpeakBtn" class="btn btn-secondary">Speak</button><button id="englishCopyBtn" class="btn btn-secondary">Copy</button><button id="englishDownloadBtn" class="btn btn-secondary">Download</button></div></div><div id="englishEmptyState" class="empty-state"><p style="font-size:14px">English translation will appear here</p></div></div></div></div><script>
          let uploadedFile = null;
          let kannadaText = '';
          let englishText = '';

          // File upload handler
          const imageInput = document.getElementById('kannadaImageInput');
          const uploadArea = document.getElementById('kannadaUploadArea');
          const imagePreview = document.getElementById('kannadaImagePreview');
          const extractBtn = document.getElementById('extractBtn');

          // Drag and drop
          uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--light-gold)';
            uploadArea.style.background = 'rgba(251, 191, 36, 0.1)';
          });

          uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'rgba(251, 191, 36, 0.5)';
            uploadArea.style.background = 'rgba(255, 255, 255, 0.02)';
          });

          uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'rgba(251, 191, 36, 0.5)';
            uploadArea.style.background = 'rgba(255, 255, 255, 0.02)';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
              handleFileSelect(files[0]);
            }
          });

          uploadArea.addEventListener('click', () => imageInput.click());
          imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
              handleFileSelect(e.target.files[0]);
            }
          });

          function handleFileSelect(file) {
            uploadedFile = file;
            const reader = new FileReader();
            reader.onload = (event) => {
              imagePreview.src = event.target.result;
              imagePreview.style.display = 'block';
              document.getElementById('kannadaExtractContainer').style.display = 'block';
              document.getElementById('kannadaEmptyState').style.display = 'none';
              showFeedback('kannadaFeedback', 'Image loaded. Click Extract Text to process.', 'success');
            };
            reader.readAsDataURL(file);
          }

          // Extract and translate
          extractBtn.addEventListener('click', extractAndTranslate);

          async function extractAndTranslate() {
            if (!uploadedFile) {
              showFeedback('kannadaFeedback', 'Please upload an image first.', 'error');
              return;
            }

            extractBtn.disabled = true;
            extractBtn.innerHTML = '<span class="spinner"></span>Processing...';
            showFeedback('kannadaFeedback', 'Extracting text from image...', 'success');

            try {
              // For production: Implement Google Cloud Vision API call to your backend
              // For demo: Use Tesseract.js (requires adding script tag)
              const text = await mockOCR(uploadedFile);
              kannadaText = text;
              updateKannadaPanel(text);
              
              showFeedback('kannadaFeedback', 'Text extracted successfully!', 'success');
              
              // Auto-translate
              await translateKannadaText(text);
            } catch (error) {
              console.error('Error:', error);
              showFeedback('kannadaFeedback', 'Error processing image. See console for details.', 'error');
            } finally {
              extractBtn.disabled = false;
              extractBtn.innerHTML = '✨ Extract Text';
            }
          }

          async function mockOCR(file) {
            // Demo implementation - in production use Google Cloud Vision API
            // Example: https://cloud.google.com/vision/docs/ocr
            return 'ಕನ್ನಡ ಭಾಷೆಯು ದ್ರಾವಿಡ ಪರಿವಾರದ ಭಾಷೆ.\nಇದು ಕರ್ನಾಟಕ ರಾ���್ಯದ ಅಧಿಕೃತ ಭಾಷೆ.\nಕನ್ನಡ ಲಿಪಿ ತುಂಬಾ ಪುರಾತನ ಮತ್ತು ಸುಂದರವಾದದ್ದು.';
          }

          async function translateKannadaText(text) {
            showFeedback('englishFeedback', 'Translating to English...', 'success');
            
            try {
              // For production: Use Google Translate API
              // https://cloud.google.com/translate/docs/basic/setup
              const translated = mockTranslate(text);
              englishText = translated;
              updateEnglishPanel(translated);
              showFeedback('englishFeedback', 'Translation complete!', 'success');
            } catch (error) {
              console.error('Translation error:', error);
              showFeedback('englishFeedback', 'Error translating text.', 'error');
            }
          }

          function mockTranslate(text) {
            // Demo implementation - in production use Google Translate API
            const translations = {
              'ಕನ್ನಡ': 'Kannada',
              'ಭಾಷೆ': 'Language',
              'ದ್ರಾವಿಡ': 'Dravidian',
              'ಪರಿವಾರ': 'Family',
              'ಕರ್ನಾಟಕ': 'Karnataka',
              'ರಾಜ್ಯ': 'State',
              'ಅಧಿಕೃತ': 'Official',
              'ಲಿಪಿ': 'Script',
              'ತುಂಬಾ': 'Very',
              'ಪುರಾತನ': 'Ancient',
              'ಸುಂದರ': 'Beautiful'
            };
            
            return 'The Kannada language is from the Dravidian family.\nIt is the official language of the state of Karnataka.\nThe Kannada script is very ancient and beautiful.';
          }

          function updateKannadaPanel(text) {
            document.getElementById('kannadaText').textContent = text;
            document.getElementById('kannadaTextContainer').style.display = 'block';
            document.getElementById('kannadaEmptyState').style.display = 'none';
            document.getElementById('kannadaExtractContainer').style.display = 'none';
          }

          function updateEnglishPanel(text) {
            document.getElementById('englishText').textContent = text;
            document.getElementById('englishTextContainer').style.display = 'block';
            document.getElementById('englishEmptyState').style.display = 'none';
          }

          // Speech synthesis
          function speakText(text, lang = 'en') {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = lang === 'kn' ? 'kn-IN' : 'en-US';
              utterance.rate = 0.9;
              window.speechSynthesis.speak(utterance);
            }
          }

          document.getElementById('kannadaSpeakBtn').addEventListener('click', () => {
            speakText(kannadaText, 'kn');
          });

          document.getElementById('englishSpeakBtn').addEventListener('click', () => {
            speakText(englishText, 'en');
          });

          // Copy to clipboard
          document.getElementById('kannadaCopyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(kannadaText).then(() => {
              showFeedback('kannadaFeedback', 'Copied to clipboard!', 'success');
            });
          });

          document.getElementById('englishCopyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(englishText).then(() => {
              showFeedback('englishFeedback', 'Copied to clipboard!', 'success');
            });
          });

          // Download text
          document.getElementById('kannadaDownloadBtn').addEventListener('click', () => {
            downloadText(kannadaText, 'kannada-text.txt');
          });

          document.getElementById('englishDownloadBtn').addEventListener('click', () => {
            downloadText(englishText, 'english-translation.txt');
          });

          function downloadText(text, filename) {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
          }

          function showFeedback(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = 'feedback ' + type;
            setTimeout(() => {
              el.className = 'feedback';
