<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals + Tasks App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
body { margin:0; font-family: Arial; background:#0f172a; color:#e2e8f0; }
.container { max-width:700px; margin:auto; padding:20px; }
h1 { text-align:center; }
input, select, button { padding:10px; margin:5px 0; border-radius:8px; border:none; }
input, select { width:65%; }
button { background:#22c55e; color:white; cursor:pointer; }
.card { background:#1e293b; padding:12px; margin-top:10px; border-radius:10px; }
.small { font-size:12px; opacity:0.7; }
.completed { text-decoration:line-through; opacity:0.6; }
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
</head>

<body>
<div class="container">
  <h1>Goals + Tasks</h1>

  <button onclick="login()">Login with Google</button>
  <div id="userInfo"></div>

  <h3>Create Goal</h3>
  <input id="goalInput" placeholder="Goal (e.g. Improve society governance)">
  <button onclick="addGoal()">Add Goal</button>

  <h3>Add Task</h3>
  <input id="taskInput" placeholder="Task">
  <select id="goalSelect"></select>
  <button onclick="addTask()">Add Task</button>

  <div id="goalsList"></div>
</div>

<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAe6hArgyl774KX6k3vA-2UbLx_qU9-nZw",
  authDomain: "vs-goals-app.firebaseapp.com",
  projectId: "vs-goals-app",
  storageBucket: "vs-goals-app.firebasestorage.app",
  messagingSenderId: "905727489096",
  appId: "1:905727489096:web:e7239222620e6650e1547d",
  measurementId: "G-0GCRJ2TRY3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = null;
let goalsMap = {};

function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById("userInfo").innerText = "Logged in: " + user.displayName;
  }
});

function addGoal() {
  const val = document.getElementById("goalInput").value;
  if (!val || !currentUser) return;

  db.collection("goals").add({
    text: val,
    user: currentUser.displayName,
    created: new Date()
  });

  document.getElementById("goalInput").value = "";
}

function addTask() {
  const text = document.getElementById("taskInput").value;
  const goalId = document.getElementById("goalSelect").value;
  if (!text || !goalId || !currentUser) return;

  db.collection("tasks").add({
    text,
    goalId,
    user: currentUser.displayName,
    done: false,
    created: new Date()
  });

  document.getElementById("taskInput").value = "";
}

// Goals listener
db.collection("goals").orderBy("created")
.onSnapshot(snapshot => {
  goalsMap = {};
  const select = document.getElementById("goalSelect");
  select.innerHTML = "";

  snapshot.forEach(doc => {
    goalsMap[doc.id] = { ...doc.data(), tasks: [] };

    const opt = document.createElement("option");
    opt.value = doc.id;
    opt.innerText = doc.data().text;
    select.appendChild(opt);
  });

  render();
});

// Tasks listener
db.collection("tasks").orderBy("created")
.onSnapshot(snapshot => {
  snapshot.forEach(doc => {
    const t = doc.data();
    if (goalsMap[t.goalId]) {
      goalsMap[t.goalId].tasks.push({ ...t, id: doc.id });
    }
  });
  render();
});

function toggleTask(id, done) {
  db.collection("tasks").doc(id).update({ done: !done });
}

function render() {
  const container = document.getElementById("goalsList");
  container.innerHTML = "";

  Object.entries(goalsMap).forEach(([goalId, goal]) => {
    const div = document.createElement("div");
    div.className = "card";

    let tasksHTML = goal.tasks.map(t => `
      <div onclick="toggleTask('${t.id}', ${t.done})" class="${t.done ? 'completed' : ''}" style="cursor:pointer">
        • ${t.text} <span class="small">(${t.user})</span>
      </div>
    `).join("");

    div.innerHTML = `
      <h3>${goal.text}</h3>
      <div class="small">by ${goal.user}</div>
      ${tasksHTML || '<div class="small">No tasks yet</div>'}
    `;

    container.appendChild(div);
  });
}

// PWA Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
