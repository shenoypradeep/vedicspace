<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Śrī Viṣṇu Sahasranāma | Vedic Space</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAF7F2;
      --text: #1F1F1F;
      --muted: #6B6B6B;
      --accent: #9C6B2F;
      --line: #E2DED6;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Serif", serif;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin: 0;
    }

    header .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    .search {
      margin: 2rem 0;
    }

    .search input {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      font-size: 1rem;
      padding: 0.6rem 0;
      font-family: inherit;
    }

    .search input:focus {
      outline: none;
      border-bottom-color: var(--accent);
    }

    .nama-card {
      padding: 2rem 0;
      border-bottom: 1px solid var(--line);
    }

    .nama-number {
      font-size: 0.8rem;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .devanagari {
      font-family: "Noto Serif Devanagari", serif;
      font-size: 2.2rem;
      margin: 0.4rem 0;
    }

    .iast {
      font-style: italic;
      color: var(--muted);
    }

    .meaning {
      margin-top: 1.2rem;
      line-height: 1.7;
    }

    .commentary-toggle {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
    }

    .commentary {
      display: none;
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="container">

  <header>
    <h1>Śrī Viṣṇu Sahasranāma</h1>
    <div class="subtitle">Vedic Space</div>
  </header>

  <div class="search">
    <input type="text" id="search" placeholder="Search nāma, number, or meaning…" />
  </div>

  <div id="results"></div>

  <footer>
    Vedic Space · Preserving Living Dharma
  </footer>

</div>

<script>
  const sahasranama = [
    {
      id: 248,
      dev: "नारायणः",
      iast: "nārāyaṇaḥ",
      meaning: "He in whom all beings rest and from whom they arise.",
      commentary: "Śaṅkara explains Nārāyaṇa as the ultimate refuge (ayana) of all beings (nara)."
    },
    {
      id: 1,
      dev: "विश्वम्",
      iast: "viśvam",
      meaning: "He who is the universe itself.",
      commentary: "The Lord is not distinct from creation, but appears as the totality of names and forms."
    }
  ];

  const results = document.getElementById("results");
  const search = document.getElementById("search");

  function render(list) {
    results.innerHTML = "";

    list.forEach(n => {
      const card = document.createElement("div");
      card.className = "nama-card";

      card.innerHTML = `
        <div class="nama-number">${n.id}</div>
        <div class="devanagari">${n.dev}</div>
        <div class="iast">${n.iast}</div>
        <div class="meaning">${n.meaning}</div>
        <div class="commentary-toggle">Show traditional commentary</div>
        <div class="commentary">${n.commentary}</div>
      `;

      const toggle = card.querySelector(".commentary-toggle");
      const commentary = card.querySelector(".commentary");

      toggle.addEventListener("click", () => {
        commentary.style.display =
          commentary.style.display === "none" || commentary.style.display === ""
            ? "block"
            : "none";
        toggle.textContent =
          commentary.style.display === "block"
            ? "Hide traditional commentary"
            : "Show traditional commentary";
      });

      results.appendChild(card);
    });
  }

  search.addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    const filtered = sahasranama.filter(n =>
      n.dev.includes(q) ||
      n.iast.toLowerCase().includes(q) ||
      n.meaning.toLowerCase().includes(q) ||
      String(n.id) === q
    );
    render(filtered);
  });

  render(sahasranama);
</script>

</body>
</html>
